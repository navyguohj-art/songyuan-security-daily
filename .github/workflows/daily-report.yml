name: Daily Songyuan Security Report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-report.yml"
      - "scripts/send_qq_pages_notification.py"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate report
        run: python scripts/generate_daily_report.py

      - name: Commit generated report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily Songyuan security report"
          file_pattern: outputs/*.html data/pe_history.json work/announcements/*.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs

  deploy-pages:
    needs: update-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send QQ notification
        if: ${{ secrets.QQ_SMTP_USER != '' && secrets.QQ_SMTP_AUTH_CODE != '' }}
        env:
          PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: python scripts/send_qq_pages_notification.py

      - name: Explain missing QQ SMTP secrets
        if: ${{ secrets.QQ_SMTP_USER == '' || secrets.QQ_SMTP_AUTH_CODE == '' }}
        run: echo "GitHub Pages deployed; QQ notification is waiting for repository secrets."
